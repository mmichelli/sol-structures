<text x="540.0" y="170" text-anchor="middle" font-family="Garamond, Times, serif" font-size="56" font-style="italic" fill="#1d1c1c" letter-spacing="0.5">The slowest stage sets the pace.</text>
<text x="540.0" y="220" text-anchor="middle" font-family="Garamond, Times, serif" font-size="28" font-style="italic" fill="#7a7775">Speed up anything else and work just piles up.</text>
<text x="540.0" y="940" text-anchor="middle" font-family="Garamond, Times, serif" font-size="30" font-style="italic" fill="#1d1c1c">If the bottleneck ran twice as fast — would you ship more?</text>
<text x="1024" y="1024" text-anchor="end" font-family="Garamond, Times, serif" font-size="16" font-style="italic" fill="#7a7775">after Sol LeWitt</text>
