<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sol structures</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  body { margin: 0; background: #fdf6ed; font-family: "Apple Garamond", "Garamond", Times, serif; color: #1d1c1c; }
  header { padding: 24px 28px; border-bottom: 1px solid #1d1c1c; display: flex; gap: 6px 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 25.8px; letter-spacing: 0.02em; font-weight: 400; }
  .sub { color: #1d1c1c; font-size: 15px; font-style: italic; }
  .sub a { color: #f72d29; text-decoration: none; }
  .sub a:hover { color: #1d1c1c; }
  .refs { flex-basis: 100%; font-size: 13px; color: #1d1c1c; margin-top: 6px; font-style: italic; }
  .refs a { color: #f72d29; text-decoration: none; }
  .refs a:hover { color: #1d1c1c; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 28px; }
  .card { background: #ffffff; border: 1px solid #1d1c1c; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: background 0.15s ease; }
  .card:hover { background: #efefef; }
  .preview { aspect-ratio: 1/1; border: 0; border-bottom: 1px solid #1d1c1c; background: #ffffff; width: 100%; display: block; }
  .meta { padding: 16px 18px; }
  .t { font-size: 20.64px; line-height: 1.2; font-weight: 400; margin-bottom: 8px; color: #1d1c1c; }
  .i { font-size: 15px; line-height: 1.5; color: #1d1c1c; font-style: italic; }
  @media (max-width: 600px) {
    h1 { font-size: 25.8px; }
    .sub { font-size: 16px; }
    .refs { font-size: 14px; }
    .t { font-size: 20px; }
    .i { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>sol structures</h1>
  <span class="sub">After <a href="https://en.wikipedia.org/wiki/Sol_LeWitt" target="_blank" rel="noopener">Sol LeWitt</a></span>
  <div class="refs">
    rendered with <a href="https://github.com/meodai/heerich" target="_blank" rel="noopener">heerich.js</a>
    &middot; <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
    &middot; SVG
    &middot; <a href="https://github.com/mmichelli/sol-structures" target="_blank" rel="noopener">source</a>
  </div>
</header>
<main id="grid"></main>

<script>
const drawings = [
  { num: '001', file: 'drawings/001-serial.html',
    title: 'Serial',
    instruction: 'A three-by-three grid of solid blocks, each block\u2019s height increasing systematically from one to nine units.' },
  { num: '002', file: 'drawings/002-incomplete.html',
    title: 'Incomplete',
    instruction: 'A four-by-four grid of cubes, each with a different piece subtracted \u2014 a corner, a column, a slot, a void.' },
  { num: '003', file: 'drawings/003-modular.html',
    title: 'Modular',
    instruction: 'A five-by-five-by-five lattice of open wireframe cubes stacked to form a single large cube.' },
  { num: '004', file: 'drawings/004-nested.html',
    title: 'Nested',
    instruction: 'Three concentric hollow cubes with a corner cut away, revealing the shells within.' },
  { num: '005', file: 'drawings/005-tower.html',
    title: 'Tower',
    instruction: 'A stack of twelve solid cubes, each offset from the one below, forming a twisting tower that lightens as it ascends.' },
  { num: '006', file: 'drawings/006-wall.html',
    title: 'Wall',
    instruction: 'A flat wall of seven-by-seven solid cubes with random cubes removed, leaving gaps and voids.' },
  { num: '007', file: 'drawings/007-staircase.html',
    title: 'Staircase',
    instruction: 'A stepped pyramid: five-by-five at the base, narrowing by one layer to a single cube at the peak.' },
  { num: '008', file: 'drawings/008-color.html',
    title: 'Colour',
    instruction: 'A four-by-four grid of solid cubes in red, yellow, blue, and black \u2014 no two adjacent cubes the same colour.' },
  { num: '009', file: 'drawings/009-open.html',
    title: 'Open',
    instruction: 'An open cube drawn in thin bars \u2014 twelve edges, no faces. A line drawing in three dimensions.' },
  { num: '010', file: 'drawings/010-incomplete.html',
    title: 'Incomplete',
    instruction: 'Twelve variations of the incomplete open cube: each shows a different connected subset of the twelve edges.' },
  { num: '011', file: 'drawings/011-lattice.html',
    title: 'Lattice',
    instruction: 'A three-by-three-by-three lattice of open cubes sharing edges. Transparent \u2014 every interior line visible.' },
  { num: '012', file: 'drawings/012-progression.html',

    title: '1 2 3 4 5 6',

  { num: '014', file: 'drawings/014-serial.html',

  { num: '015', file: 'drawings/015-modular3d.html',

  { num: '016', file: 'drawings/016-incomplete3d.html',
    title: 'Incomplete',
    instruction: 'A single large incomplete open cube. White bars casting shadows. Click for another variation.' },
  { num: '017', file: 'drawings/017-incomplete-gallery.html',
    title: 'Incomplete Gallery',
    instruction: 'Incomplete open cubes arranged on a platform. Each a different connected edge subset.' },
  { num: '018', file: 'drawings/018-tussock.html',
    title: 'Tussock',
    instruction: 'Dense clusters of vertical bars radiating from base points, repeated across a field.' },
  { num: '019', file: 'drawings/019-tunnel.html',
    title: 'Tunnel',

  { num: '020', file: 'drawings/020-strata.html',
    title: 'Strata',
    instruction: 'Six horizontal bands stacked like geological layers. Each a different thickness.' },
  { num: '021', file: 'drawings/021-pyramid.html',
    title: 'Four-Sided Pyramid',
    instruction: 'A stepped pyramid. Each layer shrinks inward, rising to an apex.' },
  { num: '022', file: 'drawings/022-grid.html',
    title: 'Sensor',
    instruction: 'A grid of short vertical marks. Density varies: sparse at edges, packed at centre.' },
  { num: '023', file: 'drawings/023-venn.html',
    title: 'Overlap',
    instruction: 'Three open rectangular forms overlapping in space. Where two meet, lines double.' },
  { num: '024', file: 'drawings/024-network.html',
    title: 'Network',
    instruction: 'Open cubes at random points, each connected to its nearest neighbour by a line.' },
  { num: '025', file: 'drawings/025-doubles.html',

  { num: '027', file: 'drawings/027-branch.html',

    title: 'Splotch',
    instruction: 'A lumpy organic mass \u2014 a sphere distorted by noise, its surface buckled into ridges and valleys.' },
  { num: '030', file: 'drawings/030-landscape.html',
    title: 'Landscape',
    instruction: 'An undulating surface \u2014 a flat plane deformed by gentle waves. Pure topology.' },
  { num: '031', file: 'drawings/031-fiveforms.html',
    title: 'Five Open Geometric Structures',

  { num: '032', file: 'drawings/032-glass.html',
    title: 'Glass Nesting',
    instruction: 'Three concentric cubes of coloured glass \u2014 red, blue, yellow. Where colours overlap, new hues emerge.' },
  { num: '033', file: 'drawings/033-spectrum.html',
    title: 'Spectrum',
    instruction: 'Twelve cubes in a row, each a different hue stepping around the colour wheel. Semi-transparent.' },
  { num: '034', file: 'drawings/034-overlap.html',
    title: 'Overlap',
    instruction: 'Three large transparent slabs \u2014 red, blue, yellow \u2014 intersecting at angles. Mixed colours where they meet.' },
  { num: '035', file: 'drawings/035-cloud.html',
    title: 'Cloud',
    instruction: 'A loose cluster of translucent spheres in soft pastels, hovering above the ground. A coloured fog made solid.' },
  { num: '036', file: 'drawings/036-totem.html',
    title: 'Totem',
    instruction: 'Five different geometric solids stacked vertically \u2014 cube, sphere, cylinder, cone, torus \u2014 each a bold colour.' },
  { num: '037', file: 'drawings/037-jewel.html',
    title: 'Jewel',
    instruction: 'A large transparent icosahedron enclosing a small coloured cube. Precious geometry.' },
  { num: '038', file: 'drawings/038-scatter.html',
    title: 'Scatter',
    instruction: 'Sixty small coloured cubes thrown into space at random positions and rotations. A frozen explosion.' },
  { num: '039', file: 'drawings/039-rings.html',
    title: 'Rings',
    instruction: 'Five concentric torus rings, each tilted at a different angle and a different transparent colour.' },
  { num: '040', file: 'drawings/040-column.html',
    title: 'Column',
    instruction: 'A tall column of stacked transparent discs, alternating colours. Light passes through each layer.' },
  { num: '041', file: 'drawings/041-prism.html',
    title: 'Crystal Field',
    instruction: 'Sharp transparent prisms grow from the ground like quartz. Each a different colour, height, and lean.' },
];

// Shuffle
for (let i = drawings.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [drawings[i], drawings[j]] = [drawings[j], drawings[i]];
}

const grid = document.getElementById('grid');
for (const d of drawings) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = d.file;
  a.innerHTML =
    '<img class="preview" src="previews/' + d.num + '.png" alt="Cube Study ' + d.num + '" loading="lazy">' +
    '<div class="meta">' +
      '<div class="t">#' + d.num + ' \u2014 ' + d.title + '</div>' +
      '<div class="i">' + d.instruction + '</div>' +
    '</div>';
  grid.appendChild(a);
}
</script>
</body>
</html>
