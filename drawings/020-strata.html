<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structure 020</title>
<script>if (window.self !== window.top || location.search.includes('embed')) document.documentElement.classList.add('embedded');</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/heerich/dist/heerich.js"></script>
</head>
<body>
<div class="card">
  <h1>#020 &mdash; Strata</h1>
  <p>Six horizontal bands stacked like geological layers. Each layer a different thickness, the ensemble a cross-section of compressed time.</p>
  <p class="source">Seed &mdash; <em>Come Down Dawn</em>: a 2021 reissue of The KLF&rsquo;s 1990 ambient album, part of a six-compilation series.</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script src="cube.js"></script>
<script type="module">
import { createScene, render, GREY } from './cube.js';
import { run } from './runner.js';

run([
  { strategy: null, draw: container => {
    const h = createScene({ tile: 14, camera: { type: 'isometric', angle: 45 } });
    let y = 0;
    const widths = [10, 10, 10, 10, 10, 10];
    const heights = [1, 2, 1, 3, 1, 2];
    for (let i = 0; i < 6; i++) {
      const grey = 130 + i * 15;
      h.addGeometry({ type: 'box', position: [0, y, 0], size: [widths[i], heights[i], 6],
        style: {
          default: { fill: `rgb(${grey},${grey},${grey})`, stroke: '#999', strokeWidth: 0.3 },
          top: { fill: `rgb(${grey+20},${grey+20},${grey+20})` },
          front: { fill: `rgb(${grey-10},${grey-10},${grey-10})` },
          left: { fill: `rgb(${grey-20},${grey-20},${grey-20})` },
        }
      });
      y += heights[i];
    }
    render(container, h);
  }},
  { strategy: "Remove specifics and convert to ambiguities", draw: container => {
    const h = createScene({ tile: 14, camera: { type: 'isometric', angle: 45 } });
    let y = 0;
    for (let i = 0; i < 6; i++) {
      const height = 1 + Math.floor(Math.random() * 3);
      const width = 6 + Math.floor(Math.random() * 6);
      const depth = 4 + Math.floor(Math.random() * 4);
      const grey = 130 + i * 15;
      h.addGeometry({ type: 'box', position: [Math.floor(Math.random()*2), y, Math.floor(Math.random()*2)], size: [width, height, depth],
        style: {
          default: { fill: `rgb(${grey},${grey},${grey})`, stroke: '#999', strokeWidth: 0.3 },
          top: { fill: `rgb(${grey+20},${grey+20},${grey+20})` },
          front: { fill: `rgb(${grey-10},${grey-10},${grey-10})` },
          left: { fill: `rgb(${grey-20},${grey-20},${grey-20})` },
        }
      });
      y += height;
    }
    render(container, h);
  }},
  { strategy: "Only one element of each kind", draw: container => {
    const h = createScene({ tile: 16, camera: { type: 'isometric', angle: 45 } });
    // Single thick slab
    h.addGeometry({ type: 'box', position: [0, 0, 0], size: [12, 3, 8], style: GREY });
    render(container, h);
  }},
]);
</script>
</body>
</html>
