<body>
<div class="card">
  <h1>#041 &mdash; Crystal Field</h1>
  <p>Sharp transparent prisms grow from the ground like quartz from a geode. Each a different colour, a different height, a different lean. A mineral garden.</p>
  <p class="source">After Sol LeWitt &mdash; irregular vertical forms</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { createScene, THREE } from './scene.js';
import { run } from './runner.js';

function rng(seed) {
  let s = seed;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}

function crystal(scene, x, z, height, radius, sides, tilt, tiltDir, color, alpha) {
  // Tapered prism — wide base, pointed top
  const shape = new THREE.Shape();
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const px = Math.cos(a) * radius;
    const py = Math.sin(a) * radius;
    if (i === 0) shape.moveTo(px, py);
    else shape.lineTo(px, py);
  }
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: height, bevelEnabled: false,
  });

  const mat = new THREE.MeshPhysicalMaterial({
    color, transparent: true, opacity: alpha,
    roughness: 0.05, metalness: 0.05,
    side: THREE.DoubleSide, depthWrite: false,
  });

  const mesh = new THREE.Mesh(geo, mat);
  // Stand upright, then tilt
  mesh.rotation.set(-Math.PI / 2, 0, 0);
  mesh.position.set(x, 0, z);

  // Wrap in group for tilting
  const group = new THREE.Group();
  group.add(mesh);
  group.rotation.set(
    Math.sin(tiltDir) * tilt,
    0,
    Math.cos(tiltDir) * tilt,
  );
  group.position.set(x, 0, z);
  mesh.position.set(0, 0, 0);

  group.castShadow = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(group);
}

const palette = [
  0xcc3344, 0xdd6633, 0xddaa22, 0x33aa55,
  0x2266cc, 0x7733bb, 0xcc3388, 0x22aaaa,
];

function field(scene, count, spread, seed) {
  const r = rng(seed);
  for (let i = 0; i < count; i++) {
    const x = (r() - 0.5) * spread;
    const z = (r() - 0.5) * spread;
    const h = 1.5 + r() * 6;
    const rad = 0.2 + r() * 0.5;
    const sides = Math.floor(r() * 3) + 4; // 4-6 sides
    const tilt = r() * 0.3;
    const tiltDir = r() * Math.PI * 2;
    const color = palette[Math.floor(r() * palette.length)];
    const alpha = 0.3 + r() * 0.35;
    crystal(scene, x, z, h, rad, sides, tilt, tiltDir, color, alpha);
  }
}

run([
  { strategy: null, draw: container => {
    const ctx = createScene(container, {
      distance: 22, angle: 30, pitch: 20, lookAt: [0, 2.5, 0],
      groundSize: 20, bg: 0xffffff,
    });
    field(ctx.scene, 25, 8, Date.now());
  }},
  { strategy: "Dense cluster", draw: container => {
    const ctx = createScene(container, {
      distance: 18, angle: 40, pitch: 25, lookAt: [0, 3, 0],
      groundSize: 15, bg: 0xffffff,
    });
    field(ctx.scene, 40, 5, Date.now());
  }},
  { strategy: "Sparse giants", draw: container => {
    const ctx = createScene(container, {
      distance: 30, angle: 25, pitch: 15, lookAt: [0, 3, 0],
      groundSize: 25, bg: 0xffffff,
    });
    const r = rng(Date.now());
    for (let i = 0; i < 8; i++) {
      const x = (r() - 0.5) * 14;
      const z = (r() - 0.5) * 14;
      const h = 4 + r() * 8;
      const rad = 0.4 + r() * 0.6;
      const sides = Math.floor(r() * 2) + 5;
      const tilt = r() * 0.15;
      const tiltDir = r() * Math.PI * 2;
      const color = palette[Math.floor(r() * palette.length)];
      crystal(ctx.scene, x, z, h, rad, sides, tilt, tiltDir, color, 0.35 + r() * 0.2);
    }
  }},
], { noClick: true });
</script>
</body>
</html>
