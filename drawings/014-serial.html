<body>
<div class="card">
  <h1>#014 &mdash; Heartbreak Express</h1>
  <p>A train of six cubes in a row. The first is whole &mdash; closed, solid, complete. Each successive cube loses more of itself: faces peel away, then edges vanish, until the last is barely there. A signal degrading down the line.</p>
  <p class="source">After Sol LeWitt &mdash; <em>Serial Project #1 (ABCD)</em>, 1966</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { createScene } from './scene.js';
import { run } from './runner.js';

const bar = 0.07;
const size = 3;
const spacing = 5;

// All 12 edges of a unit cube, as pairs of corners
function allEdges(ox, oy, oz, s) {
  const a = ox, b = oy, c = oz;
  const A = a+s, B = b+s, C = c+s;
  return [
    // bottom
    [a,b,c, A,b,c], [A,b,c, A,b,C], [A,b,C, a,b,C], [a,b,C, a,b,c],
    // top
    [a,B,c, A,B,c], [A,B,c, A,B,C], [A,B,C, a,B,C], [a,B,C, a,B,c],
    // verticals
    [a,b,c, a,B,c], [A,b,c, A,B,c], [A,b,C, A,B,C], [a,b,C, a,B,C],
  ];
}

function shuffle(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Seeded RNG so each reload gives a different but coherent set
function makeRng() {
  let s = Date.now() ^ 0xDEADBEEF;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}

function buildTrain(scene, count, rng) {
  const totalW = (count - 1) * spacing;
  const offsetX = -totalW / 2;

  for (let i = 0; i < count; i++) {
    const ox = offsetX + i * spacing - size / 2;
    const oz = -size / 2;
    const decay = i / (count - 1); // 0 = whole, 1 = almost gone

    if (decay < 0.01) {
      // First: solid closed cube
      scene.addClosedBox(ox, 0, oz, size, size, size);
    } else if (decay < 0.25) {
      // Still mostly solid — a few faces missing (show as open box with some panels)
      const edges = allEdges(ox, 0, oz, size);
      edges.forEach(e => scene.addBar(e[0],e[1],e[2],e[3],e[4],e[5], bar));
      // Add some faces as thin panels
      const t = 0.04;
      const faces = shuffle([0,1,2,3,4,5], rng);
      const keep = Math.ceil((1 - decay) * 6);
      for (let f = 0; f < keep; f++) {
        const fi = faces[f];
        if (fi === 0) scene.addPanel(ox, 0, oz, size, size, t);       // back
        if (fi === 1) scene.addPanel(ox, 0, oz+size-t, size, size, t); // front
        if (fi === 2) scene.addPanel(ox, 0, oz, t, size, size);        // left
        if (fi === 3) scene.addPanel(ox+size-t, 0, oz, t, size, size); // right
        if (fi === 4) scene.addPanel(ox, 0, oz, size, t, size);        // bottom
        if (fi === 5) scene.addPanel(ox, size-t, oz, size, t, size);   // top
      }
    } else {
      // Wireframe with edges disappearing
      const edges = shuffle(allEdges(ox, 0, oz, size), rng);
      const keep = Math.max(1, Math.round((1 - decay) * 12));
      for (let e = 0; e < keep; e++) {
        const ed = edges[e];
        scene.addBar(ed[0],ed[1],ed[2],ed[3],ed[4],ed[5], bar);
      }
    }
  }
}

run([
  { strategy: null, draw: container => {
    const rng = makeRng();
    const s = createScene(container, {
      distance: 42, angle: 35, pitch: 22, lookAt: [0, 1.5, 0],
      groundSize: 30, bg: 0xffffff,
    });
    buildTrain(s, 6, rng);
  }},
  { strategy: "Heartbreak Express — reverse the train", draw: container => {
    const rng = makeRng();
    const s = createScene(container, {
      distance: 42, angle: -35, pitch: 22, lookAt: [0, 1.5, 0],
      groundSize: 30, bg: 0xffffff,
    });
    // Build in reverse — decay goes the other way
    const count = 6, totalW = (count-1)*spacing, offsetX = -totalW/2;
    for (let i = 0; i < count; i++) {
      const ox = offsetX + i * spacing - size/2;
      const oz = -size/2;
      const decay = (count - 1 - i) / (count - 1);

      if (decay < 0.01) {
        s.addClosedBox(ox, 0, oz, size, size, size);
      } else {
        const edges = shuffle(allEdges(ox, 0, oz, size), rng);
        const keep = Math.max(1, Math.round((1 - decay) * 12));
        for (let e = 0; e < keep; e++) {
          const ed = edges[e];
          s.addBar(ed[0],ed[1],ed[2],ed[3],ed[4],ed[5], bar);
        }
      }
    }
  }},
  { strategy: "Two trains passing", draw: container => {
    const rng = makeRng();
    const s = createScene(container, {
      distance: 48, angle: 40, pitch: 28, lookAt: [0, 1.5, 0],
      groundSize: 30, bg: 0xffffff,
    });
    // Top row: decaying left to right
    const count = 6, totalW = (count-1)*spacing, offsetX = -totalW/2;
    for (let i = 0; i < count; i++) {
      const ox = offsetX + i * spacing - size/2;
      const decay = i / (count - 1);
      // Front row
      if (decay < 0.01) {
        s.addClosedBox(ox, 0, -size/2 - 2, size, size, size);
      } else {
        const edges = shuffle(allEdges(ox, 0, -size/2 - 2, size), rng);
        const keep = Math.max(1, Math.round((1 - decay) * 12));
        for (let e = 0; e < keep; e++) {
          const ed = edges[e];
          s.addBar(ed[0],ed[1],ed[2],ed[3],ed[4],ed[5], bar);
        }
      }
      // Back row: opposite direction
      const decay2 = (count - 1 - i) / (count - 1);
      if (decay2 < 0.01) {
        s.addClosedBox(ox, 0, size/2 + 2, size, size, size);
      } else {
        const edges = shuffle(allEdges(ox, 0, size/2 + 2, size), rng);
        const keep = Math.max(1, Math.round((1 - decay2) * 12));
        for (let e = 0; e < keep; e++) {
          const ed = edges[e];
          s.addBar(ed[0],ed[1],ed[2],ed[3],ed[4],ed[5], bar);
        }
      }
    }
  }},
], { noClick: true });
</script>
</body>
