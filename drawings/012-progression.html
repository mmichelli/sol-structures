<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Study 012</title>
<script>if (window.self !== window.top || location.search.includes('embed')) document.documentElement.classList.add('embedded');</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="card">
  <h1>#012 &mdash; Progression</h1>
  <p>Six open cubes in a row, each larger than the last. The growth is the subject.</p>
  <p class="source">After Sol LeWitt &mdash; <em>1 2 3 4 5 6</em>, 1978</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { isoSVG } from './iso.js';
import { run } from './runner.js';

run([
  { strategy: null, draw: container => {
    const iso = isoSVG({ scale: 22, stroke: '#333', strokeWidth: 1.3 });
    let ox = 0;
    for (let i = 1; i <= 6; i++) {
      iso.addOpenCube(ox, 0, 0, i);
      ox += i + 1;
    }
    iso.render(container);
  }},
  { strategy: "Mute and continue", draw: container => {
    // All nested concentrically
    const iso = isoSVG({ scale: 30, strokeWidth: 1.5 });
    for (let i = 1; i <= 6; i++) {
      const s = i;
      const off = (6 - s) / 2;
      const w = 0.4 + (i / 6) * 1.4;
      iso.addOpenCube(off, off, off, s, { stroke: '#333', strokeWidth: w });
    }
    iso.render(container);
  }},
  { strategy: "Do nothing for as long as possible", draw: container => {
    // Only first and last, wide gap
    const iso = isoSVG({ scale: 30, stroke: '#333', strokeWidth: 1.5 });
    iso.addOpenCube(0, 0, 0, 1);
    iso.addOpenCube(8, 0, 0, 6);
    iso.render(container);
  }},
  { strategy: "Reverse", draw: container => {
    const iso = isoSVG({ scale: 22, stroke: '#333', strokeWidth: 1.3 });
    let ox = 0;
    for (let i = 6; i >= 1; i--) {
      iso.addOpenCube(ox, 0, 0, i);
      ox += i + 1;
    }
    iso.render(container);
  }},
]);
</script>
</body>
</html>
