<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Study 002</title>
<script>if (window.self !== window.top || location.search.includes('embed')) document.documentElement.classList.add('embedded');</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="card">
  <h1>#002 &mdash; Incomplete</h1>
  <p>A four-by-four grid of cubes, each with a different piece subtracted &mdash; a corner, a column, a slot, a void. The absences define the form.</p>
  <p class="source">After Sol LeWitt &mdash; <em>Variations of Incomplete Open Cubes</em>, 1974</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { createScene, render, GREY, PALETTES } from './cube.js';
import { run } from './runner.js';

const cuts = [
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 0, z], size: [2, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+2, 0, z+2], size: [2, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 2, z], size: [2, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+2, 2, z+2], size: [2, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+1, 0, z+1], size: [2, 4, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 0, z], size: [2, 4, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+1, 0, z], size: [2, 2, 4] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 1, z+1], size: [4, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+1, 1, z], size: [2, 2, 4] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 1, z+1], size: [4, 2, 2] }),
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x+1, 0, z+1], size: [2, 4, 2] }),
  (h, x, z) => { h.removeGeometry({ type: 'box', position: [x, 0, z], size: [4, 2, 2] }); h.removeGeometry({ type: 'box', position: [x, 2, z+2], size: [4, 2, 2] }); },
  (h, x, z) => { h.removeGeometry({ type: 'box', position: [x+2, 0, z], size: [2, 4, 2] }); h.removeGeometry({ type: 'box', position: [x, 0, z], size: [2, 4, 2] }); },
  (h, x, z) => { h.removeGeometry({ type: 'box', position: [x, 0, z], size: [2, 2, 2] }); h.removeGeometry({ type: 'box', position: [x+2, 2, z+2], size: [2, 2, 2] }); },
  (h, x, z) => { h.removeGeometry({ type: 'box', position: [x+1, 0, z], size: [2, 4, 1] }); h.removeGeometry({ type: 'box', position: [x+1, 0, z+3], size: [2, 4, 1] }); h.removeGeometry({ type: 'box', position: [x, 0, z+1], size: [1, 4, 2] }); h.removeGeometry({ type: 'box', position: [x+3, 0, z+1], size: [1, 4, 2] }); },
  (h, x, z) => h.removeGeometry({ type: 'box', position: [x, 0, z+2], size: [4, 4, 2] }),
];

function buildGrid(h, style) {
  const s = 4, sp = 7, N = 4;
  for (let row = 0; row < N; row++)
    for (let col = 0; col < N; col++) {
      const ox = col * sp, oz = row * sp;
      h.addGeometry({ type: 'box', position: [ox, 0, oz], size: s, style });
      cuts[row * N + col](h, ox, oz);
    }
}

run([
  { strategy: null, draw: container => {
    const h = createScene({ tile: 12, camera: { type: 'isometric', angle: 45 } });
    buildGrid(h, GREY);
    render(container, h);
  }},
  { strategy: "Honor thy error as a hidden intention", draw: container => {
    const h = createScene({ tile: 12, camera: { type: 'isometric', angle: 45 } });
    const s = 4, sp = 7, N = 4;
    for (let row = 0; row < N; row++)
      for (let col = 0; col < N; col++) {
        const ox = col * sp, oz = row * sp;
        h.addGeometry({ type: 'box', position: [ox, 0, oz], size: s, style: GREY });
        // Apply a random cut, not the assigned one
        cuts[Math.floor(Math.random() * cuts.length)](h, ox, oz);
      }
    render(container, h);
  }},
  { strategy: "What would your closest friend do?", draw: container => {
    const h = createScene({ tile: 12, camera: { type: 'isometric', angle: 45 } });
    const s = 4, sp = 7, N = 4;
    for (let row = 0; row < N; row++)
      for (let col = 0; col < N; col++) {
        const ox = col * sp, oz = row * sp;
        const pal = PALETTES[(row + col) % 4];
        h.addGeometry({ type: 'box', position: [ox, 0, oz], size: s, style: pal });
        cuts[row * N + col](h, ox, oz);
      }
    render(container, h);
  }},
]);
</script>
</body>
</html>
