<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Study 006</title>
<script>if (window.self !== window.top || location.search.includes('embed')) document.documentElement.classList.add('embedded');</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="card">
  <h1>#006 &mdash; Wall</h1>
  <p>A flat wall of eight-by-eight cubes, one unit deep. Random cubes are removed, leaving gaps. The voids reveal the structure&rsquo;s dependence on its missing parts.</p>
  <p class="source">After Sol LeWitt &mdash; modular wall structures</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { createScene, render, GREY, PALETTES } from './cube.js';
import { run } from './runner.js';

run([
  { strategy: null, draw: container => {
    const h = createScene({ tile: 16, camera: { type: 'isometric', angle: 45 } });
    h.addGeometry({ type: 'box', position: [0, 0, 0], size: [8, 8, 1], style: GREY });
    for (let x = 0; x < 8; x++)
      for (let y = 0; y < 8; y++)
        if (Math.random() < 0.28) h.removeGeometry({ type: 'box', position: [x, y, 0], size: 1 });
    render(container, h);
  }},
  { strategy: "Breathe more deeply", draw: container => {
    const h = createScene({ tile: 14, camera: { type: 'isometric', angle: 45 } });
    // Two parallel walls with a gap between
    h.addGeometry({ type: 'box', position: [0, 0, 0], size: [8, 8, 1], style: GREY });
    h.addGeometry({ type: 'box', position: [0, 0, 3], size: [8, 8, 1], style: GREY });
    for (let x = 0; x < 8; x++)
      for (let y = 0; y < 8; y++) {
        if (Math.random() < 0.3) h.removeGeometry({ type: 'box', position: [x, y, 0], size: 1 });
        if (Math.random() < 0.3) h.removeGeometry({ type: 'box', position: [x, y, 3], size: 1 });
      }
    render(container, h);
  }},
  { strategy: "Decorate, decorate", draw: container => {
    const h = createScene({ tile: 16, camera: { type: 'isometric', angle: 45 } });
    const N = 8;
    for (let x = 0; x < N; x++)
      for (let y = 0; y < N; y++) {
        if (Math.random() < 0.28) continue;
        const pal = PALETTES[(x + y) % 4];
        h.addGeometry({ type: 'box', position: [x, y, 0], size: 1, style: pal });
      }
    render(container, h);
  }},
]);
</script>
</body>
</html>
