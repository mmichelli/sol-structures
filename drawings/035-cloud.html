<body>
<div class="card">
  <h1>#035 &mdash; Cloud</h1>
  <p>A loose cluster of translucent spheres in soft pastels, hovering above the ground. Dense at the centre, sparse at the edges. A coloured fog made solid.</p>
  <p class="source">After Sol LeWitt &mdash; irregular forms in space</p>
  <p class="strategy" id="strategy"></p>
</div>
<div class="holder" id="h"></div>
<script type="module">
import { createScene, THREE } from './scene.js';
import { run } from './runner.js';

function rng(seed) {
  let s = seed;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}

function cloud(scene, count, spread, yOff, seed) {
  const r = rng(seed);
  const geo = new THREE.SphereGeometry(1, 24, 24);
  const pastels = [0xffaaaa, 0xaaccff, 0xaaffcc, 0xffddaa, 0xddaaff, 0xffffaa];
  for (let i = 0; i < count; i++) {
    const theta = r() * Math.PI * 2;
    const phi = Math.acos(2 * r() - 1);
    const dist = r() * spread;
    const x = Math.sin(phi) * Math.cos(theta) * dist;
    const y = Math.sin(phi) * Math.sin(theta) * dist * 0.5 + yOff;
    const z = Math.cos(phi) * dist;
    const scale = 0.3 + r() * 0.8;
    const mat = new THREE.MeshStandardMaterial({
      color: pastels[Math.floor(r() * pastels.length)],
      transparent: true, opacity: 0.25 + r() * 0.2,
      roughness: 0.4, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, Math.max(y, scale), z);
    mesh.scale.setScalar(scale);
    mesh.castShadow = true;
    scene.add(mesh);
  }
}

run([
  { strategy: null, draw: container => {
    const ctx = createScene(container, {
      distance: 28, angle: 30, pitch: 20, lookAt: [0, 3, 0],
      groundSize: 20, bg: 0xffffff,
    });
    cloud(ctx.scene, 80, 5, 4, Date.now());
  }},
  { strategy: "Denser, warmer", draw: container => {
    const ctx = createScene(container, {
      distance: 25, angle: 40, pitch: 25, lookAt: [0, 3, 0],
      groundSize: 20, bg: 0xffffff,
    });
    cloud(ctx.scene, 150, 4, 3, Date.now());
  }},
  { strategy: "Two clusters", draw: container => {
    const ctx = createScene(container, {
      distance: 35, angle: 35, pitch: 22, lookAt: [0, 3, 0],
      groundSize: 25, bg: 0xffffff,
    });
    cloud(ctx.scene, 50, 3, 3, Date.now());
    cloud(ctx.scene, 50, 3, 5, Date.now() + 999);
  }},
], { noClick: true });
</script>
</body>
